    // 脱糖库依赖
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' 

    // --- 以下为新增的 Compose 和 MIUIx 依赖 ---
    def composeBom = platform('androidx.compose:compose-bom:2024.04.01')
