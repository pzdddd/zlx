plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.fuck.zlx'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fuck.zlx'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // ===== Release 签名配置：复用 debug keystore，使 release APK 可直接安装 =====
    signingConfigs {
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // ===== 体积优化：开启代码压缩 + 资源压缩 =====
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug 保持不变，方便开发调试
            minifyEnabled false
        }
    }

    // ===== 体积优化：按 ABI 拆分 APK，每个包只含对应架构的 native 库 =====
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true  // 同时生成一个通用包（含所有架构）
        }
    }

    // ===== 体积优化：Android 7+ 的 PNG 无损压缩（release 自动生效） =====
    androidResources {
        noCompress ''  // 防止某些已压缩资源被二次处理
    }
    buildFeatures {
        viewBinding true
        compose true // 开启 Compose
    }
    // 旧的 composeOptions 已经被删除了

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true 
    }
    
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

// 下面的 dependencies 保持不变...

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.vectordrawable
